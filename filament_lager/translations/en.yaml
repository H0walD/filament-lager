configuration:
  bambuddy_url:
    name: Bambuddy URL
    description: Where Bambuddy can be reached.
  api_key:
    name: API key
    description: Bambuddy API key with the "manage inventory" permission.
  benutzer:
    name: Users and permissions
    description: >-
      Add at least yourself as admin; anyone listed as admin here always stays admin.
      Groups and permissions are managed in the app on the Benutzer tab;
      other entries here only act as a default.
  standard_recht:
    name: Default permission
    description: Default for new users until a default group is chosen in the app.
