configuration:
  bambuddy_url:
    name: Bambuddy-Adresse
    description: Wo Bambuddy erreichbar ist.
  api_key:
    name: API-Schlüssel
    description: API-Schlüssel aus Bambuddy (Einstellungen → API-Schlüssel, Recht „Inventar verwalten“).
  benutzer:
    name: Benutzer und Rechte
    description: >-
      Hier mindestens dich selbst als admin eintragen. Wer hier admin ist, bleibt immer Admin.
      Alle weiteren Rechte und Gruppen stellst du in der App im Reiter Benutzer ein;
      die übrigen Einträge hier gelten nur als Vorgabe.
  standard_recht:
    name: Standard-Recht
    description: Vorgabe für neue Benutzer, bis in der App eine Standardgruppe gewählt ist.
